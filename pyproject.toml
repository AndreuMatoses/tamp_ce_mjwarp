[project]
name = "tamp-ce-mjwarp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "h5py>=3.16.0",
    "imageio[ffmpeg]>=2.37.3",
    "matplotlib>=3.11.0",
    "mujoco>=3.3",
